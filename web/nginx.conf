server {
    listen 80;
    server_name _;

    # Allow large uploads (e.g. videos)
    client_max_body_size 300m;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS：api 容器重建后 IP 变化时也能重新解析。
    # 配合变量形式的 proxy_pass 使用，api 未就绪时 nginx 仍可正常启动。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # SPA routing (Vue Router history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 通知长连接：关闭缓冲，避免事件被 Nginx 攒着不下发
    location /api/notification/stream {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # Keep original Host (incl. port) so backend can generate correct absolute URLs
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Reverse proxy to backend (strip /api prefix)
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # Keep original Host (incl. port) so backend can generate correct absolute URLs
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
