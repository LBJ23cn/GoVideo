oss:
  # 阿里云OSS Endpoint，留空时根据region自动拼接为 https://oss-<region>.aliyuncs.com
  # 如果使用自定义CNAME域名，直接填写该域名（SDK会按CNAME方式处理）
  endpoint: https://oss-cn-beijing.aliyuncs.com
  region: cn-beijing
  bucket: examplebucket
  access_key_id: change-me
  access_key_secret: change-me
  # 对象公开访问域名，可用于CDN或自定义域名；留空时使用 https://<bucket>.<endpoint>
  public_base_url: https://examplebucket.oss-cn-beijing.aliyuncs.com
  timeout_seconds: 10

observability:
  pprof:
    enabled: true
    api_addr: localhost:6060
    worker_addr: localhost:6061
